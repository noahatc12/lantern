name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # Near-vacuous here by design: decks/*.json is gitignored, so CI normally
      # sees no plaintext. Its job in CI is to catch plaintext committed by
      # mistake. The real content gate is the pre-push run, where the source is.
      - name: Content lint
        run: npm run lint:decks

      # Every gate proves it can fail. Two gates in this project have reported
      # success while enforcing nothing, and a green tick was what stopped
      # anyone looking. This is the check on the checks.
      - name: Mutation suite
        run: npm run mutate

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run budget

      # NOTE: the browser half of the suite (interaction audit, monkey,
      # dirty-state scenarios, soak, accessibility) is deliberately NOT run
      # here. It drives the real app against the real sealed content, which
      # needs the passphrase, and putting that in Actions secrets would undo the
      # property the encryption exists for. That half gates `npm run publish`
      # instead, so nothing reaches the deployed app without passing it.
